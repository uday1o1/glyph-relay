<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>GlyphRelay receiver</title>
    <link rel="stylesheet" href="/receiver.css" />
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="title">
        <p class="eyebrow">Private browser receiver</p>
        <h1 id="title">GlyphRelay</h1>
        <p id="status" role="status" aria-live="polite">
          Open a current GlyphRelay sharing link to connect.
        </p>
        <dl>
          <div>
            <dt>Connection</dt>
            <dd id="connection">Not connected</dd>
          </div>
          <div>
            <dt>Presented frames</dt>
            <dd id="frames">0</dd>
          </div>
          <div>
            <dt>Latest RTP timestamp</dt>
            <dd id="timestamp">Unavailable</dd>
          </div>
        </dl>
      </section>
      <section class="video-shell" aria-label="Shared screen">
        <video id="video" autoplay playsinline muted></video>
        <p id="empty">No remote frame has been presented.</p>
      </section>
    </main>
    <script type="module" src="/v1-receiver.js"></script>
  </body>
</html>
